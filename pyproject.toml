[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blune-cli"
version = "0.1.0"
description = "Know which model runs best, how fast, in which library, on the machine you're actually on -- before you download anything."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
mlx = ["mlx>=0.20", "mlx-lm>=0.20"]
dev = ["pytest>=7.0"]

[project.scripts]
blune = "blune_cli.cli:main"

[tool.setuptools.packages.find]
include = ["blune_cli*"]

[tool.setuptools.package-data]
blune_cli = ["measurements.json"]
